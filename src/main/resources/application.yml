spring:
  # Datasource configured via DatabaseUrlConfig bean, reads DATABASE_URL env var
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: info

